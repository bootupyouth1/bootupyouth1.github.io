<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Test Site</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1f2937, #4f46e5);
      color: #fff;
      text-align: center;
    }
    main {
      padding: 2rem;
      max-width: 520px;
    }
    h1 { font-size: 2.5rem; margin: 0 0 0.5rem; }
    p { font-size: 1.1rem; opacity: 0.9; }
    button {
      margin-top: 1rem;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: #fff;
      color: #4f46e5;
      cursor: pointer;
    }
    button:hover { background: #e0e7ff; }
    #message { margin-top: 1.5rem; font-weight: 600; min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <h1>Hello, GitHub! 👋</h1>
    <p>If you can see this page, your repository is working.</p>
    <button id="btn">Click me</button>
    <div id="message"></div>
  </main>

  <script>
    var clicks = 0;
    document.getElementById("btn").addEventListener("click", function () {
      clicks++;
      document.getElementById("message").textContent =
        "Button clicked " + clicks + (clicks === 1 ? " time" : " times") + "!";
    });
  </script>
</body>
</html>
